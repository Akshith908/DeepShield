# The full `/analyze` endpoint suite lives in test_provider_errors.py and
# test_explanation.py. The `test_bitmind*.py` files are manual smoke
# scripts (they make real provider API calls at import time and require
# network access), so pytest must skip them during automated runs.
[pytest]
addopts =
    --ignore=test_bitmind.py
    --ignore=test_bitmind_video.py
testpaths = .
